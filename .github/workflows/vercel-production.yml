name: Deploy emsyllis-group to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-emsyllis-group
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_8oVwS5n6XeSpupG2iAAVncUP
      VERCEL_PROJECT_ID: prj_lbCsizPYdYCcwOUpJdffnshPWyAC
      VERCEL_SCOPE: turkmenmuhammedeymen-3774s-projects
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check whether the Vercel token is configured
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the VERCEL_TOKEN repository secret to enable deployments."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production to Vercel
        if: steps.token.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
